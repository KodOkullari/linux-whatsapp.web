name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        run: |
          ./tests/run.sh
          ./packaging/build-source-archive.sh
          ./packaging/build-deb.sh
          sha256sum dist/*.tar.gz dist/*.deb > dist/SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.deb
            dist/SHA256SUMS
