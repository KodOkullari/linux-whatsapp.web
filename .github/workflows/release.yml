name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Build and test
        run: |
          ./tests/run.sh
          ./packaging/build-source-archive.sh
          ./packaging/build-deb.sh
          cd dist
          sha256sum ./*.tar.gz ./*.deb > SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "linux-whatsapp-web ${GITHUB_REF_NAME}" \
            --generate-notes \
            dist/*.tar.gz \
            dist/*.deb \
            dist/SHA256SUMS
